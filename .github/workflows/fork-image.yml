# Non-root container image specific to this fork (Dockerfile.nonroot + docker-bake.hcl).
# Separate file from release.yml/ci.yml: upstream merges never touch it.
#
# Published to ghcr.io/<owner>/<repo>:
#   nonroot            latest build from main
#   nonroot-<sha>      immutable tag per commit
#   nonroot-vX.Y.Z     when a v* tag is pushed
name: fork-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build linux/arm64 (slow: QEMU emulation)"
        type: boolean
        default: false

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: inputs.arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nonroot,enable={{is_default_branch}}
            type=sha,prefix=nonroot-,format=short
            type=ref,event=tag,prefix=nonroot-

      - uses: docker/bake-action@v6
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: nonroot
          push: true
          set: |
            *.platform=${{ inputs.arm64 && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
            base.args.ARTEX_VERSION=${{ github.ref_name }}-${{ github.sha }}
            *.cache-from=type=gha,scope=fork-image
            *.cache-to=type=gha,scope=fork-image,mode=max

      - name: Smoke test (non-root user, binary starts)
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}:nonroot-${GITHUB_SHA::7}"
          docker pull --platform linux/amd64 "$img"
          uid="$(docker run --rm --entrypoint id "$img" -u)"
          echo "uid=$uid"
          test "$uid" != "0"
          docker run --rm --entrypoint /app/artex "$img" -h
